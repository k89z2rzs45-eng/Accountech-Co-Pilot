<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Chart / Intelligence Polygon with Glow -->
  <g filter="url(#glow)">
    <!-- Ascending Financial Growth Bars -->
    <rect x="116" y="270" width="48" height="130" rx="12" fill="url(#glowGrad)" opacity="0.8" />
    <rect x="188" y="210" width="48" height="190" rx="12" fill="url(#accentGrad)" />
    <rect x="260" y="150" width="48" height="250" rx="12" fill="url(#accentGrad)" />
    <rect x="332" y="100" width="48" height="300" rx="12" fill="url(#glowGrad)" />

    <!-- Dynamic AI Trendline connecting them -->
    <path d="M 140 270 Q 212 170, 356 100" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />

    <!-- Sparkling Intelligence Stars -->
    <circle cx="356" cy="100" r="14" fill="#ffffff" />
    <circle cx="356" cy="100" r="22" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- Sparkle Accent -->
  <path d="M 390 140 Q 400 160, 420 170 Q 400 180, 390 200 Q 380 180, 360 170 Q 380 160, 390 140 Z" fill="#a7f3d0" />
</svg>
